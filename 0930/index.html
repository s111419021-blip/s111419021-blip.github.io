<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>唐詩300首</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --light-bg: #f8f9fa;
            --text-color: #2c3e50;
        }
        * {
            font-family: 'Segoe UI', Arial, sans-serif !important;
        }
        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }
        h2 {
            color: var(--secondary-color);
            font-size: 1.6rem;
            margin-top: 20px;
            font-weight: 600;
        }
        h3 {
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 2;
            font-weight: 500;
        }
        table {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        table tr:first-child {
            background-color: var(--secondary-color);
            color: white;
        }
        table tr:nth-child(even) {
            background-color: #f0f0f0;
        }
        table td {
            padding: 15px;
            border: 1px solid #ddd;
        }
        table img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>唐詩300首</h1>
        
        <table>
            <tr>
                <td>
                    <h2>太上隱者《答人》</h2>
                    <h3>偶來松樹下，高枕石頭眠。<br>山中無曆日，寒盡不知年。</h3>
                </td>
                <td style="text-align: center;">
                    <img src="p1.png" alt="太上隱者《答人》" style="max-width: 200px;">
                </td>
            </tr>
        </table>

        <table>
            <tr>
                <td>
                    <h2>李白《靜夜思》</h2>
                    <h3>床前明月光，疑是地上霜。<br>舉頭望明月，低頭思故鄉。</h3>
                </td>
                <td style="text-align: center;">
                    <img src="p2.png" alt="李白《靜夜思》" style="max-width: 200px;">
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
