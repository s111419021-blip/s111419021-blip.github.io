<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>許鈞棠 名片</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --light-bg: #f8f9fa;
        }
        * {
            font-family: 'Segoe UI', Arial, sans-serif !important;
        }
        body {
            background: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            display: flex;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 500px;
            max-width: 90vw;
        }
        .card-left {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2980b9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            position: relative;
        }
        .hexagon {
            width: 120px;
            aspect-ratio: 1;
            clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .hexagon img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card-right {
            flex: 1;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .contact {
            font-size: 1rem;
            color: var(--primary-color);
            line-height: 1.8;
        }
        .contact span {
            display: block;
            margin-bottom: 8px;
        }
        @media (max-width: 600px) {
            .card {
                flex-direction: column;
                width: 95vw;
            }
            .card-left {
                width: 100%;
                padding: 24px 0;
            }
            .card-right {
                padding: 24px 16px;
            }
            .name {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-left">
            <div class="hexagon">
                <img src="tom.png" alt="許鈞棠">
            </div>
        </div>
        <div class="card-right">
            <div class="name">許鈞棠</div>
            <div class="contact">
                <span><strong>學系：</strong>數位系</span>
                <span><strong>學號：</strong>s111419021</span>
                <span><strong>信箱：</strong>s111419021@stu.ntue.edu.tw</span>
                <span><strong>電話：</strong>0300-300-003</span>
            </div>
        </div>
    </div>
</body>
