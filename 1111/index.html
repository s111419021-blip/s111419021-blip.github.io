<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>網頁內嵌示例</title>
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
	<style>
		:root {
			--primary-color: #2c3e50;
			--secondary-color: #3498db;
			--light-bg: #f8f9fa;
			--text-color: #2c3e50;
		}
		* {
			font-family: 'Segoe UI', Arial, sans-serif !important;
		}
		body {
			background-color: var(--light-bg);
			color: var(--text-color);
			margin: 0;
			padding: 0;
		}
		.w3-top {
			background-color: var(--primary-color) !important;
			z-index: 1000;
		}
		.w3-bar {
			background-color: var(--primary-color) !important;
		}
		.w3-bar-item {
			color: white !important;
		}
		.w3-button {
			color: white !important;
			font-weight: 600 !important;
		}
		h1, h2, h3, h4, h5, h6 {
			color: var(--primary-color) !important;
			font-weight: 600 !important;
		}
		h1 { font-size: 2.2rem; }
		h2 { font-size: 1.8rem; }
		h3 { font-size: 1.4rem; }
		p {
			font-size: 1rem;
			line-height: 1.6;
		}
		.w3-container {
			background: white;
			border-radius: 12px;
			box-shadow: 0 2px 12px rgba(0,0,0,0.1);
			margin: 20px auto;
			padding: 20px;
			max-width: 1200px;
		}
		.content-section {
			padding: 40px 20px;
			background-color: var(--light-bg);
		}
		.section-title {
			text-align: center;
			margin-bottom: 30px;
		}
		.iframe-container {
			position: relative;
			width: 100%;
			margin: 20px 0;
			border-radius: 12px;
			overflow: hidden;
		}
		.iframe-wrapper {
			position: relative;
			padding-bottom: 56.25%;
			height: 0;
			overflow: hidden;
		}
		.iframe-wrapper iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 12px;
		}
		footer {
			background-color: var(--primary-color);
			color: white;
			padding: 40px 20px;
			text-align: center;
			margin-top: 40px;
		}
	</style>
</head>
<body>
	<!-- Navbar (sit on top) -->
	<div class="w3-top">
		<div class="w3-bar w3-wide w3-padding w3-card">
			<a href="#home" class="w3-bar-item w3-button" style="font-size: 1.5rem; font-weight: 700;"><b>Tony's</b> Page</a>
			<!-- Float links to the right. Hide them on small screens -->
			<div class="w3-right w3-hide-small">
				<a href="#location" class="w3-bar-item w3-button">位置</a>
				<a href="#video" class="w3-bar-item w3-button">影片</a>
				<a href="#contact" class="w3-bar-item w3-button">聯絡</a>
			</div>
		</div>
	</div>

	<!-- Header -->
	<div class="content-section" style="padding-top: 100px;">
		<div class="w3-container" style="text-align: center;">
			<h1>網頁內嵌展示</h1>
			<p>展示地圖和影片的內嵌功能應用</p>
		</div>
	</div>

	<!-- Location Section -->
	<div class="content-section" id="location">
		<div class="w3-container">
			<h2>地點位置</h2>
			<em><p style="margin-bottom: 20px;">以下是我隨便標的地方：</p></em>
			<div class="iframe-wrapper">
				<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8599.067992136215!2d121.52426870750959!3d25.01836617727012!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a9914fa74afd%3A0xd9c379af4e53232e!2z57SA5bee5bq15paH5a245qOu5p6X!5e0!3m2!1szh-TW!2stw!4v1761009622829!5m2!1szh-TW!2stw" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
			</div>
		</div>
	</div>

	<!-- Video Section -->
	<div class="content-section" id="video">
		<div class="w3-container">
			<h2>推薦影片</h2>
			<em><p style="margin-bottom: 20px;">從不去放棄你完整版:</p></em>
			<div style="max-width: 800px; margin: 0 auto;">
				<div class="iframe-wrapper">
					<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=XFevlB_OGmLtBaTa" title="推薦影片" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-downgrade" allowfullscreen></iframe>
				</div>
			</div>
		</div>
	</div>

	<!-- Footer -->
	<footer id="contact">
		<h3>聯絡資訊</h3>
		<p>信箱：s111419021@stu.ntue.edu.tw</p>
		<p>電話：0300-300-003</p>
		<p>&竹南石油王子</p>
	</footer>
</body>
</html>
